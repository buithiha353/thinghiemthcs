<title>Thư viện thí nghiệm ảo KHTN THCS</title>

<meta property="og:title" content="Thư viện thí nghiệm ảo KHTN THCS">
<meta property="og:description" content="Thư viện thí nghiệm ảo KHTN THCS — Mô phỏng 2.5D thực hành trên trình duyệt theo SGK Khoa học tự nhiên Bộ Kết nối tri thức với cuộc sống.">

<style>
  :root{
    --paper:#fffdf7; --paper-edge:#efe6d3;
    --ink:#2c2419; --ink-soft:#6f6552; --ink-faint:#9a8f78;
    --purple-1:#7b1fa2; --purple-2:#c2185b;
    --panel-bg:#ffffff; --panel-border:#ece3cf; --panel-shadow: rgba(60,40,10,0.12);
    --chip-bg:#f4ecd8; --chip-ink:#7a5a24;
    --body-bg:#f2ece0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#26221c; --paper-edge:#3a352b;
      --ink:#f1ead9; --ink-soft:#c9bea6; --ink-faint:#8c8270;
      --panel-bg:#2c2820; --panel-border:#423c30; --panel-shadow: rgba(0,0,0,0.4);
      --chip-bg:#3a3324; --chip-ink:#e2c98a;
      --body-bg:#1b1812;
    }
  }
  :root[data-theme="dark"]{
    --paper:#26221c; --paper-edge:#3a352b;
    --ink:#f1ead9; --ink-soft:#c9bea6; --ink-faint:#8c8270;
    --panel-bg:#2c2820; --panel-border:#423c30; --panel-shadow: rgba(0,0,0,0.4);
    --chip-bg:#3a3324; --chip-ink:#e2c98a;
    --body-bg:#1b1812;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--body-bg); color: var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1,h2,h3,h4{ font-family:'Baloo 2', sans-serif; }
  .shell{ max-width:1160px; margin:0 auto; padding:18px 18px 60px; }

  /* Banner chỉ để lại tiêu đề gọn gàng đúng yêu cầu */
  .banner{
    position:relative; overflow:hidden;
    background: linear-gradient(125deg, #6a1b9a 0%, #8e24aa 50%, #c2185b 100%);
    border-radius:24px; padding:22px 28px; color:#fff;
    box-shadow: 0 12px 28px -12px rgba(106,27,154,0.5);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  .banner h1{ margin:0; font-size:clamp(22px,3.8vw,30px); font-weight:800; letter-spacing:-0.3px; }

  .filter-section{
    margin:20px 0;
    background:var(--panel-bg);
    border:1px solid var(--panel-border);
    border-radius:20px;
    padding:18px 20px;
    box-shadow: 0 6px 18px -10px var(--panel-shadow);
    display:flex; flex-direction:column; gap:13px;
  }
  .filter-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .filter-label{ font-size:13px; font-weight:700; color:var(--ink-soft); min-width:92px; display:inline-flex; align-items:center; gap:5px; }
  .filter-chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .filter-btn{
    border:1.5px solid var(--panel-border); background:var(--paper); color:var(--ink);
    padding:5px 13px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:'Inter'; transition: all .15s ease;
  }
  .filter-btn:hover{ border-color:var(--purple-1); color:var(--purple-1); }
  .filter-btn[aria-pressed="true"]{ background:var(--purple-1); border-color:var(--purple-1); color:#fff; }

  .search-row{
    display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;
    padding-top:10px; border-top:1px dashed var(--panel-border);
  }
  .search-box{
    position:relative; flex:1; min-width:240px; max-width:440px;
  }
  .search-box input{
    width:100%; padding:8px 14px 8px 34px;
    border-radius:999px; border:1.5px solid var(--panel-border);
    background:var(--paper); color:var(--ink); font-family:'Inter'; font-size:13.5px;
    outline:none; transition: border-color .15s;
  }
  .search-box input:focus{ border-color:var(--purple-1); }
  .search-box span.search-icon{
    position:absolute; left:11px; top:50%; transform:translateY(-50%);
    font-size:14px; color:var(--ink-faint); pointer-events:none;
  }
  .view-options{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); }
  .view-toggle-btn{
    background:var(--paper); border:1.5px solid var(--panel-border); border-radius:8px;
    padding:5px 10px; font-size:12.5px; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .view-toggle-btn[data-active="true"]{ background:var(--chip-bg); border-color:var(--chip-ink); color:var(--chip-ink); }

  /* Nhóm danh mục */
  .category-group{ margin-top:26px; }
  .category-header{
    display:flex; align-items:center; justify-content:space-between;
    padding-bottom:10px; border-bottom:2px solid var(--panel-border); margin-bottom:16px;
  }
  .category-title{ display:flex; align-items:center; gap:10px; margin:0; font-size:19px; color:var(--ink); }
  .category-badge{
    background:rgba(123,31,162,0.12); color:var(--purple-1);
    font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; font-family:'Inter';
  }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
  .card{
    display:flex; flex-direction:column; justify-content:space-between;
    text-decoration:none; color:inherit;
    background:var(--panel-bg); border:1.5px solid var(--panel-border); border-radius:20px;
    padding:18px; box-shadow: 0 8px 20px -12px var(--panel-shadow);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card:hover{
    transform: translateY(-4px);
    box-shadow: 0 16px 28px -12px var(--panel-shadow);
    border-color:var(--purple-1);
  }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .card .icon-box{
    width:46px; height:46px; border-radius:14px; background:var(--chip-bg);
    display:flex; align-items:center; justify-content:center; font-size:24px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.06); flex-shrink:0;
  }
  .card-lesson-badge{
    font-size:11px; font-weight:700; color:var(--purple-1);
    background:rgba(123,31,162,0.1); padding:4px 9px; border-radius:999px;
  }
  .card h3{ margin:6px 0 6px; font-size:16.5px; line-height:1.3; font-family:'Baloo 2'; color:var(--ink); font-weight:700; }
  .card .desc{ font-size:12.5px; color:var(--ink-soft); line-height:1.45; margin:0 0 14px; flex-grow:1; }
  .card .ref{ font-size:11.5px; color:var(--ink-faint); margin:0 0 12px; font-weight:500; }
  
  .card-footer{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding-top:12px; border-top:1px solid var(--paper-edge);
  }
  .card .tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .card .tag{ background:var(--chip-bg); color:var(--chip-ink); font-size:11px; padding:3px 8px; border-radius:999px; font-weight:600; }
  .card .tag.grade{ background:rgba(123,31,162,0.12); color:var(--purple-1); }
  .card .tag.subject-vl{ background:#e3f2fd; color:#1565c0; }
  .card .tag.subject-hh{ background:#fff3e0; color:#e65100; }
  .card .tag.subject-sh{ background:#e8f5e9; color:#2e7d32; }

  .card-action{
    font-size:12px; font-weight:700; color:var(--purple-1);
    display:inline-flex; align-items:center; gap:3px; white-space:nowrap;
  }
  .card:hover .card-action{ text-decoration:underline; }

  .empty{ text-align:center; color:var(--ink-faint); padding:60px 0; font-size:15px; }
  .empty-icon{ font-size:40px; margin-bottom:10px; }
</style>
</head>
<body>
<div class="shell">
  <!-- Banner chỉ giữ lại tiêu đề đúng yêu cầu -->
  <div class="banner">
    <h1>Thư viện thí nghiệm ảo KHTN THCS</h1>

    </div>

    <!-- Thanh tìm kiếm & Chế độ xem -->
    <div class="search-row">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên bài, số bài, từ khoá (vd: âm thoa, quang hợp, nam châm, thấu kính, men-đen)..." autocomplete="off">
      </div>
      <div class="view-options">
        <span>Chế độ hiển thị:</span>
        <button class="view-toggle-btn" id="btnGroupView" data-active="true">📂 Gom nhóm danh mục</button>
        <button class="view-toggle-btn" id="btnGridView" data-active="false">🔲 Lưới liên tục</button>
      </div>
    </div>
  </div>

  <!-- Khu vực hiển thị danh mục / danh sách bài -->
  <div id="contentArea"></div>

  <!-- Thông báo rỗng -->

    <div>Không tìm thấy thí nghiệm nào phù hợp với bộ lọc hiện tại.</div>

      desc: "Nhúng Fe vào dd CuSO₄ (Fe đẩy Cu tạo lớp đồng đỏ) và Cu vào dd AgNO₃ (Cu đẩy Ag tạo tinh thể bạc sáng), kiểm chứng quy luật Fe > Cu > Ag.",
      file: "experiments/hh9-day-hoat-dong-kim-loai.html"
    },
    {
      id: "hh9-phan-ung-ruou-etilic",
      title: "Tính chất hoá học của Rượu ethylic (Ethanol)",
      subject: "hoa-hoc",
      icon: "🔥",
      grade: 9,
      category: "phan-ung-hoa-hoc",
      lesson: "Bài 22",
      sgk_ref: "KHTN 9 — KNTT, Bài 22",
      desc: "Đốt cháy rượu ethylic với ngọn lửa xanh mờ toả nhiều nhiệt (tạo CO₂ và H₂O) và phản ứng thế nhóm -OH với mẩu Natri giải phóng bọt khí H₂.",
      file: "experiments/hh9-phan-ung-ruou-etilic.html"
    },
    {
      id: "sh9-lai-men-den",
      title: "Thí nghiệm lai một cặp tính trạng của Men-đen",
      subject: "sinh-hoc",
      icon: "🫛",
      grade: 9,
      category: "sinh-hoc",
      lesson: "Bài 36",
      sgk_ref: "KHTN 9 — KNTT, Bài 36",
      desc: "Phép lai hạt vàng x hạt xanh ở đậu Hà Lan, thế hệ F₁ đồng tính (100% vàng), thế hệ F₂ phân li tỉ lệ xấp xỉ 3 hạt vàng : 1 hạt xanh trên lưới Punnett.",
      file: "experiments/sh9-lai-men-den.html"
    },
    {
      id: "sh9-chuoi-thuc-an-sinh-thai",
      title: "Hệ sinh thái & Chuỗi thức ăn",
      subject: "sinh-hoc",
      icon: "🦅",
      grade: 9,
      category: "sinh-hoc",
      lesson: "Bài 44",
      sgk_ref: "KHTN 9 — KNTT, Bài 44",
      desc: "Khảo sát mắt xích dinh dưỡng Cỏ → Cào cào → Ếch → Rắn → Đại bàng, quy luật dòng năng lượng 10% và phản ứng dây chuyền khi biến động quần thể.",
      file: "experiments/sh9-chuoi-thuc-an-sinh-thai.html"
    }
  ];

  const SUBJECT_LABEL = { "vat-ly":"Vật lí", "hoa-hoc":"Hoá học", "sinh-hoc":"Sinh học" };
  const SUBJECT_CLASS = { "vat-ly":"subject-vl", "hoa-hoc":"subject-hh", "sinh-hoc":"subject-sh" };

  let currentGrade = 'all';
  let currentSubject = 'all';
  let currentCategory = 'all';
  let searchQuery = '';
  let isGroupView = true;

  const contentArea = document.getElementById('contentArea');
  const emptyMsg = document.getElementById('emptyMsg');
  const searchInput = document.getElementById('searchInput');

  function renderCardHTML(e){
    return `
      <a class="card" href="${e.file}">
        <div>
          <div class="card-top">
            <div class="icon-box">${e.icon || '🧪'}</div>
            <span class="card-lesson-badge">${e.lesson || ('Lớp ' + e.grade)}</span>
          </div>
          <h3>${e.title}</h3>
          <p class="desc">${e.desc || ''}</p>
          <div class="ref">📖 ${e.sgk_ref}</div>
        </div>
        <div class="card-footer">
          <div class="tags">
            <span class="tag grade">Lớp ${e.grade}</span>
            <span class="tag ${SUBJECT_CLASS[e.subject] || ''}">${SUBJECT_LABEL[e.subject] || e.subject}</span>
          </div>
          <span class="card-action">Vào thực hành ›</span>
        </div>
      </a>
    `;
  }

  function getFilteredList(){
    const q = searchQuery.trim().toLowerCase();
    return EXPERIMENTS.filter(e => {
      const matchGrade = (currentGrade === 'all') || (String(e.grade) === currentGrade);
      const matchSubject = (currentSubject === 'all') || (e.subject === currentSubject);
      const matchCategory = (currentCategory === 'all') || (e.category === currentCategory);
      
      let matchSearch = true;
      if (q) {
        const text = (e.title + ' ' + (e.desc||'') + ' ' + (e.lesson||'') + ' ' + (e.sgk_ref||'') + ' ' + (SUBJECT_LABEL[e.subject]||'')).toLowerCase();
        matchSearch = text.includes(q);
      }

      return matchGrade && matchSubject && matchCategory && matchSearch;
    });
  }

  function renderView(){
    const list = getFilteredList();

    if (list.length === 0) {
      contentArea.innerHTML = '';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    if (!isGroupView) {
      contentArea.innerHTML = `
        <div class="grid" style="margin-top:10px;">
          ${list.map(e => renderCardHTML(e)).join('')}
        </div>
      `;
      return;
    }

    // Dạng gom nhóm theo Danh mục
    const grouped = {};
    list.forEach(e => {
      const catKey = e.category || 'khac';
      if (!grouped[catKey]) grouped[catKey] = [];
      grouped[catKey].push(e);
    });

    let html = '';
    for (const [catKey, items] of Object.entries(grouped)) {
      const catInfo = CATEGORIES[catKey] || { name: "Danh mục khác", chapter: "", icon: "📁" };
      html += `
        <div class="category-group">
          <div class="category-header">
            <h2 class="category-title">
              <span>${catInfo.icon}</span>
              <span>${catInfo.name}</span>
            </h2>
            <div style="display:flex; align-items:center; gap:8px;">
              ${catInfo.chapter ? `<span style="font-size:12px; color:var(--ink-faint); font-weight:600;">${catInfo.chapter}</span>` : ''}
              <span class="category-badge">${items.length} bài thí nghiệm</span>
            </div>
          </div>
          <div class="grid">
            ${items.map(e => renderCardHTML(e)).join('')}
          </div>
        </div>
      `;
    }

    contentArea.innerHTML = html;
  }

  // Lắng nghe sự kiện chọn khối Lớp
  document.getElementById('gradeFilters').addEventListener('click', (ev)=>{
    const btn = ev.target.closest('.filter-btn');
    if(!btn) return;
    document.querySelectorAll('#gradeFilters .filter-btn').forEach(b=>b.setAttribute('aria-pressed','false'));
    btn.setAttribute('aria-pressed','true');
    currentGrade = btn.dataset.grade;
    renderView();
  });

  // Lắng nghe sự kiện chọn Phân môn
  document.getElementById('subjectFilters').addEventListener('click', (ev)=>{
    const btn = ev.target.closest('.filter-btn');
    if(!btn) return;
    document.querySelectorAll('#subjectFilters .filter-btn').forEach(b=>b.setAttribute('aria-pressed','false'));
    btn.setAttribute('aria-pressed','true');
    currentSubject = btn.dataset.subject;
    renderView();
  });

  // Lắng nghe sự kiện chọn Danh mục
  document.getElementById('categoryFilters').addEventListener('click', (ev)=>{
    const btn = ev.target.closest('.filter-btn');
    if(!btn) return;
    document.querySelectorAll('#categoryFilters .filter-btn').forEach(b=>b.setAttribute('aria-pressed','false'));
    btn.setAttribute('aria-pressed','true');
    currentCategory = btn.dataset.category;
    renderView();
  });

  // Lắng nghe ô tìm kiếm
  searchInput.addEventListener('input', (ev)=>{
    searchQuery = ev.target.value;
    renderView();
  });

  // Chuyển đổi chế độ hiển thị
  const btnGroupView = document.getElementById('btnGroupView');
  const btnGridView = document.getElementById('btnGridView');

  btnGroupView.addEventListener('click', ()=>{
    isGroupView = true;
    btnGroupView.setAttribute('data-active', 'true');
    btnGridView.setAttribute('data-active', 'false');
    renderView();
  });

  btnGridView.addEventListener('click', ()=>{
    isGroupView = false;
    btnGroupView.setAttribute('data-active', 'false');
    btnGridView.setAttribute('data-active', 'true');
    renderView();
  });

  renderView();
</script>
</body>
</html>
